# Local development stack: Postgres + API + Web.
# Usage: docker compose up --build   (then open http://localhost:3000)
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: avocado
      POSTGRES_PASSWORD: avocado
      POSTGRES_DB: avocado
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: ./apps/api
    environment:
      DATABASE_URL: postgresql://avocado:avocado@db:5432/avocado
      SECRET_KEY: local-dev-secret
      CORS_ORIGINS: http://localhost:3000
      SEED_ON_START: "true"
      ENVIRONMENT: development
    ports:
      - "8000:8000"
    depends_on:
      - db

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
